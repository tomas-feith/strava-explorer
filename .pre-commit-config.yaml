# Ruff + mypy run automatically on every commit.
# Install once after `uv sync`:  uv run pre-commit install
# Run against everything on demand:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff            # lint (auto-fixes what it can)
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # Match the project's typing surface; deps provide stubs at runtime.
        additional_dependencies: [pandas-stubs, types-requests, numpy]
        exclude: ^tests/

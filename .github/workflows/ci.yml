name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  checks:
    # Windows is the platform this is run on, and freeport.py exists because of
    # Windows bind semantics -- the bug it guards against only reproduces there,
    # so an Ubuntu-only build could never have caught it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv stopped publishing moving major tags after v7.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra fit

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      # Targets come from [tool.mypy] files in pyproject, so a new module cannot
      # slip past by not being added to a list here.
      - name: Mypy (type-check)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  secret-scan:
    # This repo holds Strava OAuth credentials in .env; .gitignore is the only
    # thing keeping them out of history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: gitleaks scans commits, not the worktree
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisation-owned repos.

version: 2

# Keeps CI action pins and Python deps from silently rotting -- this repo was
# still on actions/checkout@v5 when v7 was current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
    groups:
      # Dev tooling batched: a bad ruff or mypy bump is a lint diff, not a
      # behaviour change.
      dev-tools:
        dependency-type: development
        patterns:
          - "*"
      # Runtime PATCH bumps batched as well. They are the high-volume, low-risk
      # majority, and one PR per patch is most of the review toil for almost
      # none of the risk. Minor and major runtime bumps deliberately stay
      # individual, so a dash or pandas change that can move behaviour still
      # gets looked at on its own.
      runtime-patch:
        dependency-type: production
        update-types:
          - patch
        patterns:
          - "*"

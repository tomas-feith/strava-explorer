version: 2

# Keeps CI action pins and Python deps from silently rotting -- this repo was
# still on actions/checkout@v5 when v7 was current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # Dev tooling batched; runtime deps stay individual so a dash or pandas
      # bump gets reviewed on its own.
      dev-tools:
        dependency-type: development
        patterns:
          - "*"

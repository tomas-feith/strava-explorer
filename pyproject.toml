[project]
name = "strava-explorer"
version = "0.1.0"
description = "Local dashboard to explore all your Strava runs: heatmaps, pace/PR progression, HR zones, grade-adjusted pace, aerobic decoupling, and per-run routes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Feith" }]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "dash>=4.4.1",
    "plotly>=5.22",
    "pandas>=3.0.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# FIT-file parsing is only needed if your Strava archive contains .fit files.
fit = ["fitparse>=1.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=2.3",
    "ruff>=0.16",
    "pre-commit>=4.6.1",
    "pandas-stubs>=3.0.5.260730",
    "types-requests>=2.31",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# This is an application (flat top-level modules), not an installable library,
# so uv manages the environment without building/installing the project itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
# 3.12 so mypy can parse modern numpy/pandas type stubs; runtime still >=3.11.
python_version = "3.12"
# Check the whole tree rather than a hand-listed set of modules: the list had
# already gone stale once (freeport.py was missing), and a new top-level module
# should not be able to escape type-checking by not being added to it.
files = ["."]
exclude = ["\\.venv", "^data/"]
ignore_missing_imports = true   # dash / plotly / fitparse ship no stubs
warn_redundant_casts = true
warn_unused_ignores = false
# Pragmatic: fully type-check annotated functions (the analytics + numeric
# helpers), but don't nitpick the untyped defensive XML-parsing bodies.
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # make the flat top-level modules importable from tests/
addopts = "--cov --cov-report=term-missing"
# For a targeted run that would trip the floor: uv run pytest -k foo --no-cov

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
# A ratchet, not an aspiration: currently ~62% (source only -- counting the
# test files themselves inflated this to 46% back when the floor was 33).
# Only catches regressions; raise it as tests land. export_runs.py and
# strava_auth.py are still untested -- both are thin wrappers over live HTTP.
fail_under = 60
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
